[build-system]
requires = ['setuptools>=82', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = "pacman"
version = "0.0.1"
authors = [
    {name="achevali"},
    {name="egouy"}
]
description = "a remplir"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
"pygame-ce>=2.5.0",
"pydantic>=2.0.0"
]
[tool.flake8]
exclude = ["pacmana"]

[[tool.mypy.overrides]]
module = ["mazegenerator"]
follow_untyped_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]